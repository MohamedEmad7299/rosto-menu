<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <defs>
    <linearGradient id="rostoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a3b"/>
      <stop offset="50%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#b20710"/>
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Crown on Top of R -->
  <g fill="url(#rostoRedGrad)">
    <path d="M 125 18 C 122 18, 120 20, 120 23 C 120 25, 121 26, 122 27 L 128 42 L 142 32 L 148 44 L 160 22 C 160 19, 158 17, 155 17 C 152 17, 150 19, 150 22 L 145 34 L 138 25 C 137 23, 134 22, 132 24 L 126 31 Z"/>
    <!-- Crown Orbs -->
    <circle cx="118" cy="18" r="4.5"/>
    <circle cx="134" cy="12" r="4.5"/>
    <circle cx="152" cy="10" r="5"/>
    <circle cx="170" cy="13" r="4.5"/>
    <circle cx="184" cy="20" r="4.5"/>
    <path d="M 115 45 C 135 40, 165 40, 185 45 L 180 38 C 172 26, 168 22, 168 22 L 158 35 L 152 20 L 144 35 L 135 22 L 130 35 L 120 24 Z"/>
  </g>

  <!-- Flaming Wings to the Left of R -->
  <g fill="url(#rostoRedGrad)" filter="url(#flameGlow)">
    <!-- Top flame wing -->
    <path d="M 125 48 C 100 48, 70 42, 45 36 C 58 44, 76 50, 95 53 C 70 52, 40 50, 25 45 C 38 54, 60 62, 85 64 C 55 64, 30 68, 18 75 C 35 79, 65 80, 95 78 C 65 85, 45 95, 32 105 C 52 101, 80 94, 115 88 Z"/>
    <!-- Bottom flame wing -->
    <path d="M 110 88 C 85 96, 55 106, 35 120 C 58 114, 85 106, 115 102 C 80 114, 60 128, 48 138 C 72 130, 98 120, 130 114 Z"/>
  </g>

  <!-- ROSTO Text -->
  <text x="120" y="112" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" font-style="italic" fill="url(#rostoRedGrad)" letter-spacing="1">ROSTO</text>

  <!-- CHICKEN & MORE Tagline -->
  <text x="210" y="145" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="800" font-size="22" fill="url(#rostoRedGrad)" letter-spacing="4.5">CHICKEN &amp; MORE</text>
</svg>